name: Docker Build and Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-dockerfiles
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: orbis-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: orbis-frontend:latest
          build-args: |
            VITE_API_URL=https://localhost
            VITE_AUTH0_DOMAIN=placeholder.auth0.com
            VITE_AUTH0_CLIENT_ID=placeholder
            VITE_AUTH0_REDIRECT_URI=https://localhost
            VITE_AUTH0_AUDIENCE=https://api.orbis.com
            VITE_AUTH0_SCOPE=openid profile email
            VITE_SUPABASE_URL=https://placeholder.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder
            VITE_SUPABASE_SERVICE_ROLE_KEY=placeholder

      - name: Verify Backend Image
        run: docker images orbis-backend

      - name: Verify Frontend Image Size
        run: |
          SIZE=$(docker images orbis-frontend --format "{{.Size}}")
          echo "Frontend image size: $SIZE"
          echo "Target: < 110MB"
